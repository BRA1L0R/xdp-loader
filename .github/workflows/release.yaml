on:
  push:
    tags: ["v*.*.*"]

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:slim
    steps:
      - uses: actions/checkout@v1
      - run: rustup component add clippy
      - run: cargo clippy
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    container: rust:slim
    needs: [check]
    steps:
      - uses: actions/checkout@master
      - name: Compile binaries
        id: compile
        uses: rust-build/rust-build.action@v1.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          RUSTTARGET: x86_64-unknown-linux-musl
          EXTRA_FILES: "README.md LICENSE.md"
          TOOLCHAIN_VERSION: stable
          UPLOAD_MODE: none

      - name: Generate changelog
        id: changelog
        run: |
          # Simple changelog generation based on git commits
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          repository: BRA1L0R/xdp-loader
          body: |
            ## Changelog
            ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.compile.outputs.BUILT_ARCHIVE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Upload artifact
